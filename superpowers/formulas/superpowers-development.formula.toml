description = """
Superpowers implementation item formula.

This converts the Superpowers plan task structure into explicit Gas City graph
steps for one implementation bead. The implementation bead carries the task
scope; this formula carries the execution process.
"""
formula = "superpowers-development"
version = 1
contract = "graph.v2"
extends = ["do-work"]
target_required = true

[vars]
[vars.worktree_checks]
description = "Canonical JSON required_checks [{id, argv}], captured once on the native run."
default = ""

[vars.worktree_base_ref]
description = "Initial source selector. @default captures registered rig HEAD. Empty is invalid."
default = "@default"

[vars.worktree_parent]
description = "Managed workspace parent. Empty selects the rig default; a nonempty value must be an absolute existing directory."
default = ""

[vars.worktree_name_prefix]
description = "Safe prefix prepended to the stable workspace owner/generation name. Empty preserves the default name."
default = ""

[vars.worktree_allow_external_parent]
description = "Explicit true permits a managed workspace parent outside the rig. Recorded layout cannot change on resume."
default = "false"
enum = ["false", "true"]

[vars.worktree_lifecycle]
description = "Retained source lifecycle. New uses the composed native workspace helpers and captured policy."
default = "new"
enum = ["new"]

[vars.implementation_target]
description = "Superpowers task implementation role."
default = "superpowers.implementer"

[[steps]]
id = "validate-workspace-mode"
title = "Validate methodology source lifecycle"
metadata = { "gc.run_target" = "gc.run-operator", "gc.lifecycle" = "{{worktree_lifecycle}}", "gc.lifecycle.source_modes" = "{\"workflow\":\"new\"}" }
description_file = "../assets/workflows/workspace-mode/validate.md"

[steps.check]
max_attempts = 1

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/workspace-lifecycle-valid.py"
timeout = "1m"

[[steps]]
id = "implement"
title = "Inspect Superpowers implementation task"
needs = ["prepare-worktree"]
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.continuation_group" = "superpowers-task-{{issue}}", "gc.build.artifact_schema" = "gc.build.implementation-summary.v1", "gc.build.artifact_path_keys" = "gc.implementation.summary_path,gc.build.implementation_summary_path,gc.var.summary_path" }
description_file = "../assets/workflows/superpowers-development/implement.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "write-failing-test"
title = "Write failing test for Superpowers task"
needs = ["implement"]
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.continuation_group" = "superpowers-task-{{issue}}" }
description_file = "../assets/workflows/superpowers-development/write-failing-test.md"

[[steps]]
id = "verify-test-fails"
title = "Verify Superpowers task test fails"
needs = ["write-failing-test"]
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.continuation_group" = "superpowers-task-{{issue}}" }
description_file = "../assets/workflows/superpowers-development/verify-test-fails.md"

[[steps]]
id = "implement-change"
title = "Implement Superpowers task change"
needs = ["verify-test-fails"]
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.continuation_group" = "superpowers-task-{{issue}}" }
description_file = "../assets/workflows/superpowers-development/implement-change.md"

[[steps]]
id = "verify-test-passes"
title = "Verify Superpowers task tests pass"
needs = ["implement-change"]
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.continuation_group" = "superpowers-task-{{issue}}" }
description_file = "../assets/workflows/superpowers-development/verify-test-passes.md"

[[steps]]
id = "task-review"
title = "Run Superpowers task fanout review"
needs = ["verify-test-passes"]
metadata = { "gc.run_target" = "superpowers.code-quality-reviewer" }
expand = "superpowers-task-review"
expand_vars = { worktree_lifecycle = "{{worktree_lifecycle}}", implementation_target = "{{implementation_target}}", worktree_base_ref = "{{worktree_base_ref}}", worktree_checks = "{{worktree_checks}}", worktree_parent = "{{worktree_parent}}", worktree_name_prefix = "{{worktree_name_prefix}}", worktree_allow_external_parent = "{{worktree_allow_external_parent}}" }
description_file = "../assets/workflows/superpowers-development/task-review.md"

[[steps]]
id = "record-item-result"
title = "Record Superpowers task result"
needs = ["task-review"]
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.continuation_group" = "superpowers-task-{{issue}}", "gc.build.artifact_schema" = "gc.build.implementation-summary.v1" }
description_file = "../assets/workflows/superpowers-development/record-item-result.md"

[[steps]]
id = "independent-acceptance"
title = "Independently review the committed Superpowers task"
needs = ["record-item-result"]
condition = "{{worktree_lifecycle}} == new"
metadata = { "gc.run_target" = "gc.implementation-reviewer" }
description_file = "../assets/workflows/do-work/independent-acceptance.md"

[[steps]]
id = "close-source-anchor"
title = "Close Superpowers implementation task"
needs = ["record-item-result", "record-result"]
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/superpowers-development/close-source-anchor.md"

[[steps]]
id = "prepare-worktree"
title = "Prepare admitted methodology item worktree"
needs = ["validate-workspace-mode"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.lifecycle" = "{{worktree_lifecycle}}", "gc.lifecycle.source_modes" = "{\"workflow\":\"new\"}" }
description_file = "../assets/workflows/do-work/prepare-worktree.md"

[steps.check]
max_attempts = 1

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/workspace-lifecycle-valid.py"
timeout = "1m"
