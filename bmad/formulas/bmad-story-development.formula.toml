description = """
BMAD story-development item formula.

This converts BMAD quick-dev's "sub-agent/task" handoff into explicit Gas City
implementation and review lanes.
"""
formula = "bmad-story-development"
version = 1
contract = "graph.v2"
extends = ["do-work"]
target_required = true

[vars]
[vars.worktree_checks]
description = "Canonical JSON required_checks [{id, argv}], required only in new mode and captured once on the native run."
default = ""

[vars.worktree_base_ref]
description = "Initial source selector. @default captures registered rig HEAD. Empty is invalid."
default = "@default"

[vars.worktree_parent]
description = "Managed workspace parent. Empty selects the rig default; a nonempty value must be an absolute existing directory."
default = ""

[vars.worktree_name_prefix]
description = "Safe prefix prepended to the stable workspace owner/generation name. Empty preserves the default name."
default = ""

[vars.worktree_allow_external_parent]
description = "Explicit true permits a managed workspace parent outside the rig. Recorded layout cannot change on resume."
default = "false"
enum = ["false", "true"]

[vars.worktree_lifecycle]
description = "Retained source lifecycle. New uses the composed native workspace helpers and captured policy."
default = "legacy"
enum = ["legacy", "new"]

[[steps]]
id = "validate-workspace-mode"
title = "Validate methodology source lifecycle"
metadata = { "gc.run_target" = "gc.run-operator", "gc.lifecycle" = "{{worktree_lifecycle}}", "gc.lifecycle.source_modes" = "{\"workflow\":\"new\"}", "gc.lifecycle.compatibility" = "legacy" }
description_file = "../assets/workflows/workspace-mode/validate.md"

[steps.check]
max_attempts = 1

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/workspace-lifecycle-valid.py"
timeout = "1m"

[[steps]]
id = "implement"
title = "Run BMAD story development until clean"
needs = ["prepare-worktree"]
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/bmad-story-development/implement.md"

[steps.check]
max_attempts = 8

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/implementation-review-approved.sh"
timeout = "10m"

[[steps.children]]
id = "setup-bmad-story-development"
title = "Prepare BMAD story development"
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/bmad-story-development/setup-bmad-story-development.md"

[[steps.children]]
id = "implement-story"
title = "BMAD implement story"
needs = ["setup-bmad-story-development"]
metadata = { "gc.run_target" = "bmad.story-implementer" }
description_file = "../assets/workflows/bmad-story-development/implement-story.md"

[[steps.children]]
id = "story-self-check"
title = "BMAD story self-check"
needs = ["implement-story"]
metadata = { "gc.run_target" = "bmad.story-self-checker" }
description_file = "../assets/workflows/bmad-story-development/story-self-check.md"

[[steps.children]]
id = "acceptance-audit"
title = "BMAD acceptance audit"
needs = ["story-self-check"]
metadata = { "gc.run_target" = "bmad.acceptance-auditor" }
description_file = "../assets/workflows/bmad-story-development/acceptance-audit.md"

[[steps.children]]
id = "apply-story-findings"
title = "Apply BMAD story findings"
needs = ["acceptance-audit"]
metadata = { "gc.run_target" = "bmad.story-implementer", "gc.continuation_group" = "bmad-story-fixes", "gc.build.artifact_schema" = "gc.build.implementation-summary.v1" }
description_file = "../assets/workflows/bmad-story-development/apply-story-findings.md"

[[steps]]
id = "prepare-worktree"
title = "Prepare admitted methodology item worktree"
needs = ["validate-workspace-mode"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.lifecycle" = "{{worktree_lifecycle}}", "gc.lifecycle.source_modes" = "{\"workflow\":\"new\"}", "gc.lifecycle.compatibility" = "legacy" }
description_file = "../assets/workflows/do-work/prepare-worktree.md"

[steps.check]
max_attempts = 1

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/workspace-lifecycle-valid.py"
timeout = "1m"
