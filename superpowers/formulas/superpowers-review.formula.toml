description = """
Superpowers implementation of the code-review-base methodology contract.
"""
formula = "superpowers-review"
version = 1
contract = "graph.v2"
extends = ["code-review-base"]
target_required = false
internal = true
mode = "report"

[vars]
[vars.worktree_checks]
description = "Canonical JSON required_checks [{id, argv}], captured once on the native run."
default = ""

[vars.worktree_base_ref]
description = "Initial source selector. @default captures registered rig HEAD. Empty is invalid."
default = "@default"

[vars.worktree_parent]
description = "Managed workspace parent. Empty selects the rig default; a nonempty value must be an absolute existing directory."
default = ""

[vars.worktree_name_prefix]
description = "Safe prefix prepended to the stable workspace owner/generation name. Empty preserves the default name."
default = ""

[vars.worktree_allow_external_parent]
description = "Explicit true permits a managed workspace parent outside the rig. Recorded layout cannot change on resume."
default = "false"
enum = ["false", "true"]

[vars.worktree_lifecycle]
description = "Retained source lifecycle; new requires composed methodology acceptance."
default = "new"
enum = ["new"]

[vars.implementation_target]
description = "Superpowers task implementation role used for review fixes."
default = "superpowers.implementer"

[[steps]]
id = "validate-workspace-mode"
title = "Validate methodology review source lifecycle"
metadata = { "gc.run_target" = "gc.run-operator", "gc.lifecycle" = "{{worktree_lifecycle}}", "gc.lifecycle.source_modes" = "{\"workflow\":\"new\"}" }
description_file = "../assets/workflows/workspace-mode/validate.md"

[steps.check]
max_attempts = 1

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/workspace-lifecycle-valid.py"
timeout = "1m"

[[steps]]
id = "validate-context"
title = "Validate admitted methodology review context"
needs = ["validate-workspace-mode"]
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/code-review-base/validate-context.md"

[[steps]]
id = "write-report"
title = "Run Superpowers review"
needs = ["validate-context"]
metadata = { "gc.run_target" = "superpowers.code-reviewer", "gc.build.artifact_schema" = "gc.build.review.v1", "gc.build.artifact_path_keys" = "gc.build.code_review_report_path,gc.build.review_report_path,gc.var.report_path" }
expand = "superpowers-code-review"
expand_vars = { worktree_lifecycle = "{{worktree_lifecycle}}", implementation_target = "{{implementation_target}}", review_mode = "{{review_mode}}", artifact_path_keys = "gc.build.code_review_report_path,gc.build.review_report_path,gc.var.report_path", worktree_base_ref = "{{worktree_base_ref}}", worktree_checks = "{{worktree_checks}}", worktree_parent = "{{worktree_parent}}", worktree_name_prefix = "{{worktree_name_prefix}}", worktree_allow_external_parent = "{{worktree_allow_external_parent}}" }
description_file = "../assets/workflows/superpowers-review/write-report.md"
