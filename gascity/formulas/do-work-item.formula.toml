description = """
Single-lane item implementation formula used only inside core shared drain.

Launch inputs:
- input_convoy: {{convoy_id}}
- context_path: {{context_path}} (empty means no extra context bundle)
- implementation_target: {{implementation_target}}
"""
formula = "do-work-item"
version = 1
contract = "graph.v2"
extends = ["implementation-item-base"]
target_required = true
internal = true
single_lane = true

[vars]
[vars.worktree_base_ref]
description = "Initial source selector; @default captures the registered repository HEAD. Empty is invalid."
default = "@default"

[vars.worktree_checks]
description = "Canonical JSON required_checks [{id, argv}]. Required when worktree_lifecycle is new; captured once on the run."
default = ""

[vars.worktree_parent]
description = "Managed workspace parent. Empty selects the rig default; a nonempty value must be an absolute existing directory."
default = ""

[vars.worktree_name_prefix]
description = "Safe prefix prepended to the stable workspace owner/generation name. Empty preserves the default name."
default = ""

[vars.worktree_allow_external_parent]
description = "Explicit true permits a managed workspace parent outside the rig. Recorded layout cannot change on resume."
default = "false"
enum = ["false", "true"]

[vars.worktree_lifecycle]
description = "Retained shared run lifecycle; new advances members through accepted workspace checkpoints."
default = "legacy"

[vars.context_path]
description = "Optional context bundle path."
default = ""

[vars.implementation_target]
description = "Role target for implementation work."
default = "gc.implementation-worker"

[[steps]]
id = "prepare-worktree"
title = "Prepare the shared member's accepted native input"
condition = "{{worktree_lifecycle}} == new"
metadata = { "gc.run_target" = "gc.run-operator", "gc.lifecycle" = "{{worktree_lifecycle}}", "gc.lifecycle.source_modes" = "{\"workflow\":\"new\"}", "gc.lifecycle.compatibility" = "legacy" }
description_file = "../assets/workflows/do-work-item/prepare-worktree.md"

[[steps]]
id = "implement-item"
needs = ["prepare-worktree"]
title = "Implement shared-drain item"
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.build.artifact_schema" = "gc.build.implementation-summary.v1", "gc.build.artifact_path_keys" = "gc.implementation.summary_path,gc.build.implementation_summary_path,gc.var.summary_path" }
description_file = "../assets/workflows/do-work-item/implement-item.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "independent-acceptance"
title = "Independently review the exact shared member output"
needs = ["implement-item"]
condition = "{{worktree_lifecycle}} == new"
metadata = { "gc.run_target" = "gc.implementation-reviewer" }
description_file = "../assets/workflows/do-work-item/independent-acceptance.md"

[[steps]]
id = "record-result"
title = "Record qualified shared member and owner output"
needs = ["independent-acceptance"]
condition = "{{worktree_lifecycle}} == new"
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/do-work-item/record-result.md"

[[steps]]
id = "close-source-anchor"
title = "Close the qualified shared member"
needs = ["implement-item", "record-result"]
condition = "{{worktree_lifecycle}} == new"
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/do-work-item/close-source-anchor.md"
