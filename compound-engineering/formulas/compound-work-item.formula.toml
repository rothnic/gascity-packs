description = """
Compound Engineering item implementation formula for shared drain context.

This runs one serialized convoy member through the vendored ce-work role
without creating an isolated source-anchor worktree.
"""
formula = "compound-work-item"
version = 1
contract = "graph.v2"
extends = ["do-work-item"]
target_required = true
internal = true
single_lane = true

[vars]
[vars.worktree_checks]
description = "Canonical JSON required_checks [{id, argv}], required only in new mode and captured once on the native run."
default = ""

[vars.worktree_base_ref]
description = "Initial source selector. @default captures registered rig HEAD. Empty is invalid."
default = "@default"

[vars.worktree_parent]
description = "Managed workspace parent. Empty selects the rig default; a nonempty value must be an absolute existing directory."
default = ""

[vars.worktree_name_prefix]
description = "Safe prefix prepended to the stable workspace owner/generation name. Empty preserves the default name."
default = ""

[vars.worktree_allow_external_parent]
description = "Explicit true permits a managed workspace parent outside the rig. Recorded layout cannot change on resume."
default = "false"
enum = ["false", "true"]

[vars.worktree_lifecycle]
description = "Retained source lifecycle. New uses the composed native workspace helpers and captured policy."
default = "new"
enum = ["legacy", "new"]

[vars.implementation_target]
description = "Compound Engineering implementation role."
default = "compound-engineering.ce-work"

[[steps]]
id = "validate-workspace-mode"
title = "Validate methodology source lifecycle"
metadata = { "gc.run_target" = "gc.run-operator", "gc.lifecycle" = "{{worktree_lifecycle}}", "gc.lifecycle.source_modes" = "{\"workflow\":\"new\"}", "gc.lifecycle.compatibility" = "legacy" }
description_file = "../assets/workflows/workspace-mode/validate.md"

[steps.check]
max_attempts = 1

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/workspace-lifecycle-valid.py"
timeout = "1m"

[[steps]]
id = "implement-item"
title = "Implement Compound shared-drain item"
needs = ["validate-workspace-mode", "prepare-worktree"]
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.build.artifact_schema" = "gc.build.implementation-summary.v1", "gc.build.artifact_path_keys" = "gc.implementation.summary_path,gc.build.implementation_summary_path,gc.var.summary_path" }
description_file = "../assets/workflows/compound-work-item/implement-item.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
