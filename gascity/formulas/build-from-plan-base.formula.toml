description = """
Virtual build continuation contract from approved requirements.

This suffix starts when approved requirements already exist. It produces the
implementation plan and plan-review verdict, then hands off to
`build-from-decompose-base` through the inherited `prepare-decompose` step.
"""
formula = "build-from-plan-base"
version = 1
contract = "graph.v2"
extends = ["build-from-decompose-base"]
target_required = false
internal = true

[metadata.gc.methodology]
allowed_drain_policies = ["separate", "same-session"]
implementation_strategy = "drain"
interaction_modes = ["interactive", "autonomous", "headless"]
review_modes = ["report", "agent", "interactive"]

[vars]
[vars.worktree_checks]
description = "Canonical JSON required_checks [{id, argv}], required only in new mode and captured once on the native run."
default = ""

[vars.worktree_base_ref]
description = "Initial source selector. @default captures registered rig HEAD. Empty is invalid."
default = "@default"

[vars.worktree_parent]
description = "Managed workspace parent. Empty selects the rig default; a nonempty value must be an absolute existing directory."
default = ""

[vars.worktree_name_prefix]
description = "Safe prefix prepended to the stable workspace owner/generation name. Empty preserves the default name."
default = ""

[vars.worktree_allow_external_parent]
description = "Explicit true permits a managed workspace parent outside the rig. Recorded layout cannot change on resume."
default = "false"
enum = ["false", "true"]

[vars.worktree_lifecycle]
description = "Retained source lifecycle. New uses native owned workspaces and captured project checks."
default = "new"
enum = ["legacy", "new"]

[vars.planning_formula]
description = "Planning methodology formula used for requirements and implementation-plan artifacts."
default = "planning-base"

[vars.plan_path]
description = "Implementation plan artifact path to create or reuse."
default = ""

[vars.plan_review_path]
description = "Plan-review artifact path to create or reuse."
default = ""

[[steps]]
id = "prepare-plan"
title = "Validate plan continuation inputs"
metadata = { "gc.run_target" = "gc.run-operator", "gc.lifecycle" = "{{worktree_lifecycle}}", "gc.lifecycle.source_modes" = "{\"workflow\":\"new\"}", "gc.lifecycle.compatibility" = "legacy" }
description_file = "../assets/workflows/build-from-plan-base/prepare-plan.md"

[steps.check]
max_attempts = 1

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/workspace-lifecycle-valid.py"
timeout = "1m"

[[steps]]
id = "plan"
title = "Produce implementation plan"
needs = ["prepare-plan"]
metadata = { "gc.run_target" = "gc.design-author", "gc.build.artifact_schema" = "gc.build.plan.v1", "gc.build.artifact_path_keys" = "gc.build.plan_path,gc.var.plan_path" }
description_file = "../assets/workflows/build-from-plan-base/plan.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "plan-review"
title = "Review implementation plan"
needs = ["plan"]
metadata = { "gc.run_target" = "gc.review-synthesizer", "gc.build.plan_review_required" = "true" }
description_file = "../assets/workflows/build-from-plan-base/plan-review.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/plan-review-approved.py"
timeout = "5m"

[[steps]]
id = "prepare-decompose"
title = "Validate decompose continuation inputs"
needs = ["plan-review"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.lifecycle" = "{{worktree_lifecycle}}", "gc.lifecycle.source_modes" = "{\"workflow\":\"new\"}", "gc.lifecycle.compatibility" = "legacy" }
description_file = "../assets/workflows/build-from-plan-base/prepare-decompose.md"

[steps.check]
max_attempts = 1

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/workspace-lifecycle-valid.py"
timeout = "1m"
