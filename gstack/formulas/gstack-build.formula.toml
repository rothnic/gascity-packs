description = """
gstack implementation of the Gas City build-base contract.

This formula adapts garrytan/gstack's sprint model onto Gas City:
Think -> Plan -> Build -> Review -> Test -> Ship -> Reflect.
"""
formula = "gstack-build"
version = 1
contract = "graph.v2"
extends = ["build-base"]
target_required = true

[catalog]
name = "gstack-build"
description = "Run build-base with garrytan/gstack office-hours planning, multi-lane reviews, QA, and release readiness."

[metadata.gc.methodology]
allowed_drain_policies = ["separate", "same-session"]
implementation_strategy = "drain"
interaction_modes = ["interactive", "autonomous", "headless"]
review_modes = ["report", "agent", "interactive"]

[vars]
[vars.worktree_checks]
description = "Canonical JSON required_checks [{id, argv}], captured once on the native run."
default = ""

[vars.worktree_base_ref]
description = "Initial source selector. @default captures registered rig HEAD. Empty is invalid."
default = "@default"

[vars.worktree_parent]
description = "Managed workspace parent. Empty selects the rig default; a nonempty value must be an absolute existing directory."
default = ""

[vars.worktree_name_prefix]
description = "Safe prefix prepended to the stable workspace owner/generation name. Empty preserves the default name."
default = ""

[vars.worktree_allow_external_parent]
description = "Explicit true permits a managed workspace parent outside the rig. Recorded layout cannot change on resume."
default = "false"
enum = ["false", "true"]

[vars.worktree_lifecycle]
description = "Retained source lifecycle. New uses native owned workspaces and captured project checks."
default = "new"
enum = ["new"]

[vars.implementation_target]
description = "gstack task implementation role."
default = "gstack.implementer"

[vars.planning_formula]
description = "gstack planning methodology formula."
default = "gstack-planning"

[vars.decomposition_formula]
description = "gstack decomposition methodology formula."
default = "gstack-decomposition"

[vars.implementation_formula]
description = "gstack implementation entry formula."
default = "gstack-implementation"

[vars.implementation_item_formula]
description = "gstack single-item implementation formula."
default = "gstack-work-item"

[vars.code_review_formula]
description = "gstack code-review methodology formula."
default = "gstack-review"

[vars.review_fix_formula]
description = "gstack review-fix methodology formula."
default = "gstack-fix-loop"

[vars.interaction_mode]
description = "Workflow interaction posture: interactive, autonomous, or headless."
default = "interactive"

[vars.review_mode]
description = "Review authority: report, agent, or interactive."
default = "interactive"

[[steps]]
id = "requirements"
title = "gstack office-hours requirements"
needs = ["prepare"]
metadata = { "gc.scope_ref" = "build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "gstack.office-hours", "gc.build.artifact_schema" = "gc.build.requirements.v1", "gc.build.artifact_path_keys" = "gc.build.requirements_path,gc.var.requirements_path" }
description_file = "../assets/workflows/gstack-build/requirements.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "plan"
title = "gstack autoplan draft"
needs = ["requirements"]
metadata = { "gc.scope_ref" = "build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "gstack.founder-reviewer", "gc.build.artifact_schema" = "gc.build.plan.v1", "gc.build.artifact_path_keys" = "gc.build.plan_path,gc.var.plan_path" }
description_file = "../assets/workflows/gstack-build/plan.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "plan-review"
title = "gstack plan review fanout"
needs = ["plan"]
metadata = { "gc.scope_ref" = "build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "gstack.review-synthesizer", "gc.build.plan_review_required" = "true" }
expand = "gstack-plan-review"
expand_vars = { failure_scope = "build-body", implementation_target = "{{implementation_target}}", interaction_mode = "{{interaction_mode}}", worktree_lifecycle = "{{worktree_lifecycle}}", worktree_base_ref = "{{worktree_base_ref}}", worktree_checks = "{{worktree_checks}}", worktree_parent = "{{worktree_parent}}", worktree_name_prefix = "{{worktree_name_prefix}}", worktree_allow_external_parent = "{{worktree_allow_external_parent}}" }
description_file = "../assets/workflows/gstack-build/plan-review.md"

[[steps]]
id = "decompose"
title = "Create gstack implementation convoy"
needs = ["plan-review"]
metadata = { "gc.scope_ref" = "build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "gstack.decomposer", "gc.build.artifact_schema" = "gc.build.decomposition.v1", "gc.build.artifact_path_keys" = "gc.build.decomposition_path,gc.var.decomposition_path" }
description_file = "../assets/workflows/gstack-build/decompose.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "implement"
title = "Drain gstack work"
needs = ["decompose"]
condition = "{{drain_policy}} == separate"
metadata = { "gc.scope_ref" = "build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "{{implementation_target}}" }
description_file = "../assets/workflows/gstack-build/implement.md"

[steps.drain]
context = "separate"
formula = "gstack-work"
member_access = "exclusive"

[[steps]]
id = "implement-same-session"
title = "Drain gstack work in one shared session"
needs = ["decompose"]
condition = "{{drain_policy}} == same-session"
metadata = { "gc.scope_ref" = "build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "{{implementation_target}}" }
description_file = "../assets/workflows/gstack-build/implement-same-session.md"

[steps.drain]
context = "shared"
formula = "gstack-work-item"
on_item_failure = "skip_remaining"
member_access = "exclusive"

[steps.drain.item]
single_lane = true

[[steps]]
id = "review"
title = "gstack review fanout"
needs = ["summarize-implementation"]
metadata = { "gc.scope_ref" = "build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "gstack.review-synthesizer", "gc.build.artifact_schema" = "gc.build.review.v1", "gc.build.artifact_path_keys" = "gc.build.review_report_path" }
expand = "gstack-code-review"
expand_vars = { failure_scope = "build-body", worktree_lifecycle = "{{worktree_lifecycle}}", implementation_target = "{{implementation_target}}", review_mode = "{{review_mode}}", artifact_path_keys = "gc.build.review_report_path", worktree_base_ref = "{{worktree_base_ref}}", worktree_checks = "{{worktree_checks}}", worktree_parent = "{{worktree_parent}}", worktree_name_prefix = "{{worktree_name_prefix}}", worktree_allow_external_parent = "{{worktree_allow_external_parent}}" }
description_file = "../assets/workflows/gstack-build/review.md"

[[steps]]
id = "finalize"
title = "Finalize gstack sprint"
needs = ["release-readiness", "review-result"]
metadata = { "gc.scope_ref" = "build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "gstack.release-engineer", "gc.build.artifact_schema" = "gc.build.final-report.v1", "gc.build.artifact_path_keys" = "gc.build.final_report_path" }
description_file = "../assets/workflows/gstack-build/finalize.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "publish"
title = "Optionally publish gstack sprint"
needs = ["finalize"]
metadata = { "gc.scope_ref" = "build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "gc.publisher" }
description_file = "../assets/workflows/gstack-build/publish.md"

[[steps]]
id = "qa"
title = "gstack QA fanout"
needs = ["review"]
metadata = { "gc.scope_ref" = "build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "gstack.qa-lead" }
expand = "gstack-qa-review"
expand_vars = { failure_scope = "build-body", worktree_lifecycle = "{{worktree_lifecycle}}", implementation_target = "{{implementation_target}}", interaction_mode = "{{interaction_mode}}", worktree_base_ref = "{{worktree_base_ref}}", worktree_checks = "{{worktree_checks}}", worktree_parent = "{{worktree_parent}}", worktree_name_prefix = "{{worktree_name_prefix}}", worktree_allow_external_parent = "{{worktree_allow_external_parent}}" }
description_file = "../assets/workflows/gstack-build/qa.md"

[[steps]]
id = "release-readiness"
title = "gstack release readiness fanout"
needs = ["qa"]
metadata = { "gc.scope_ref" = "build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "gstack.release-engineer" }
expand = "gstack-release-readiness"
expand_vars = { failure_scope = "build-body", worktree_lifecycle = "{{worktree_lifecycle}}", review_mode = "{{review_mode}}", worktree_base_ref = "{{worktree_base_ref}}", worktree_checks = "{{worktree_checks}}", worktree_parent = "{{worktree_parent}}", worktree_name_prefix = "{{worktree_name_prefix}}", worktree_allow_external_parent = "{{worktree_allow_external_parent}}" }
description_file = "../assets/workflows/gstack-build/release-readiness.md"

[[steps]]
id = "build-body"
title = "Build pipeline scope"
needs = ["prepare", "requirements", "plan", "plan-review", "decompose", "implement", "implement-same-session", "summarize-implementation", "review", "review-result", "finalize", "publish", "qa", "release-readiness"]
description_file = "../assets/workflows/gstack-build/build-body.md"
metadata = { "gc.kind" = "scope", "gc.scope_name" = "build", "gc.scope_role" = "body" }
